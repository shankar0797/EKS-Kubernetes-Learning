apiVersion: apps/v1
kind: Deployment
metadata:
  name: services-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: services-demo
  template:
    metadata:
      labels:
        app: services-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
