apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-demo
  namespace: hpa-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hpa-demo
  template:
    metadata:
      labels:
        app: hpa-demo
    spec:
      containers:
        - name: cpu-demo
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                :
              done
          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "200m"
