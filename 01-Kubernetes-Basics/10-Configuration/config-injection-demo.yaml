apiVersion: v1
kind: Pod
metadata:
  name: config-injection-demo
spec:
  containers:
    - name: app
      image: nginx:1.27

      envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret

      env:
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD
