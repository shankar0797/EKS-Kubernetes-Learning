apiVersion: apps/v1
kind: Deployment

metadata:
  name: crashloop-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: crashloop-demo

  template:
    metadata:
      labels:
        app: crashloop-demo

    spec:
      containers:
        - name: nginx
          image: nginx:1.29

          command:
            - /bin/sh
            - -c
            - "echo 'Application started successfully'; nginx -g 'daemon off;'"
