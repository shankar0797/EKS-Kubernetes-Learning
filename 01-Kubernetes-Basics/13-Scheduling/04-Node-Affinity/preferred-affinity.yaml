apiVersion: v1
kind: Pod
metadata:
  name: preferred-affinity-demo

spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: workload
                operator: In
                values:
                  - application

  containers:
    - name: nginx
      image: nginx:1.27
