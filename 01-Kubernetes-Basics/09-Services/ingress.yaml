apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-demo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /one
            pathType: Prefix
            backend:
              service:
                name: ingress-app-one
                port:
                  number: 80

          - path: /two
            pathType: Prefix
            backend:
              service:
                name: ingress-app-two
                port:
                  number: 80
