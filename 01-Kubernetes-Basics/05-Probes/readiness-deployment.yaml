apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-readiness

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx-readiness

  template:
    metadata:
      labels:
        app: nginx-readiness

    spec:
      containers:
        - name: nginx
          image: nginx:1.29

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
