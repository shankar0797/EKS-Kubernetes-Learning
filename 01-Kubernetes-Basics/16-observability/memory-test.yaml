apiVersion: v1
kind: Pod
metadata:
  name: memory-test
  namespace: observability-lab
spec:
  containers:
    - name: memory-test
      image: python:3.12-alpine
      command:
        - python
        - -c
        - |
          data = []
          while True:
              data.append("x" * 1024 * 1024)
