apiVersion: apps/v1
kind: Deployment
metadata:
  name: obs-demo-app
  namespace: obs-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: obs-demo
  template:
    metadata:
      labels:
        app: obs-demo
    spec:
      containers:
        - name: app
          image: obs-demo-app:2.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
