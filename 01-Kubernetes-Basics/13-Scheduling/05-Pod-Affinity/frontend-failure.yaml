apiVersion: v1
kind: Pod
metadata:
  name: frontend-affinity-failure
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: database
          topologyKey: kubernetes.io/hostname

  containers:
    - name: frontend
      image: nginx:1.27
