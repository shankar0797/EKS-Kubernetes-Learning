apiVersion: apps/v1
kind: Deployment

metadata:
  name: crash-secret

spec:
  replicas: 1

  selector:
    matchLabels:
      app: crash-secret

  template:
    metadata:
      labels:
        app: crash-secret

    spec:
      containers:
        - name: app
          image: busybox:1.36

          env:
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: username

            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: password

          command:
            - /bin/sh
            - -c
            - |
              echo "Application starting..."
              echo "Checking database credentials..."

              if [ -z "$DATABASE_USERNAME" ]; then
                echo "ERROR: DATABASE_USERNAME is missing"
                exit 1
              fi

              if [ -z "$DATABASE_PASSWORD" ]; then
                echo "ERROR: DATABASE_PASSWORD is missing"
                exit 1
              fi

              echo "Database credentials loaded successfully"

              while true; do
                sleep 30
              done
