apiVersion: batch/v1
kind: Job

metadata:
  name: failed-job

spec:
  backoffLimit: 2

  template:
    spec:
      restartPolicy: Never

      containers:
        - name: failure
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              echo "Starting job..."
              echo "Something went wrong!"
              exit 1
