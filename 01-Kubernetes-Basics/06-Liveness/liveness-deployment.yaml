apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-liveness

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx-liveness

  template:
    metadata:
      labels:
        app: nginx-liveness

    spec:
      containers:
        - name: nginx
          image: nginx:1.29

          ports:
            - containerPort: 80

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
