apiVersion: apps/v1
kind: Deployment

metadata:
  name: strategy-demo

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: strategy-demo

  template:
    metadata:
      labels:
        app: strategy-demo

    spec:
      containers:
        - name: nginx
          image: nginx:1.27

          ports:
            - containerPort: 80
