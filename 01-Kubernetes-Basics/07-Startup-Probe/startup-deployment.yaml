apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-startup

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx-startup

  template:
    metadata:
      labels:
        app: nginx-startup

    spec:
      containers:
        - name: nginx
          image: nginx:1.29

          ports:
            - containerPort: 80

          startupProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 12
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
