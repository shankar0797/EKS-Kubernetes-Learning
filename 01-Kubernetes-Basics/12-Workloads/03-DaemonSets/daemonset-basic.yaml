apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: node-agent

spec:
  selector:
    matchLabels:
      app: node-agent

  template:
    metadata:
      labels:
        app: node-agent

    spec:
      containers:
        - name: agent
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              echo "DaemonSet agent started"
              echo "Node: $NODE_NAME"
              while true; do
                echo "Agent running..."
                sleep 30
              done

          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
