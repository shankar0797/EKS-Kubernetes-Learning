apiVersion: batch/v1
kind: CronJob

metadata:
  name: hello-cronjob

spec:
  schedule: "*/1 * * * *"

  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never

          containers:
            - name: hello
              image: busybox:1.36

              command:
                - sh
                - -c
                - |
                  echo "Hello from Kubernetes CronJob"
                  echo "Execution time: $(date)"
