apiVersion: batch/v1
kind: Job

metadata:
  name: hello-job

spec:
  template:

    spec:
      restartPolicy: Never

      containers:
        - name: hello
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              echo "Hello Kubernetes Job"
              echo "This task is running..."
              sleep 5
              echo "Job completed successfully"
