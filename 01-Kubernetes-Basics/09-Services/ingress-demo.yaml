apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-app-one
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingress-app-one
  template:
    metadata:
      labels:
        app: ingress-app-one
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-app-one
spec:
  type: ClusterIP
  selector:
    app: ingress-app-one
  ports:
    - port: 80
      targetPort: 80
---
